:root{
  --bg:#faf7f2; --paper:#fffdf9; --fg:#1c1813; --muted:#8b8175;
  --line:#e6ddcf; --accent:#8a6f4a; --soft:#f1e9dc;
}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Apple Symbols","Noto Sans SC",sans-serif;
  -webkit-text-size-adjust:100%;
}

.bar{
  position:sticky;top:0;z-index:20;background:rgba(250,247,242,.94);
  backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid var(--line);
  padding:9px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.bar h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.badge{font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--soft);
  color:#7a6242;white-space:nowrap}
.badge.ok{background:#e8f1e8;color:#3f6b46}
.badge.bad{background:#fbe9e4;color:#a94d34}
.spacer{flex:1}
button{
  font:inherit;font-size:12px;padding:6px 9px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:#4d4438;white-space:nowrap;
}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{background:transparent}

.wrap{max-width:900px;margin:0 auto;padding:14px 12px 120px}

#paper{
  font-family:"SiddhamEmbed",sans-serif;
  font-size:32px;line-height:2.05;
  background:var(--paper);
  border:1px solid var(--line);border-radius:12px;
  padding:20px 18px;min-height:44vh;
  outline:none;white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere;
  box-shadow:0 1px 0 rgba(0,0,0,.02);
}
#paper:empty:before{
  content:attr(data-ph);color:#c3b8a6;font-family:-apple-system,"PingFang SC",sans-serif;
  font-size:14px;line-height:1.8;
}

    <b>手机上请用浏览器打开</b>（Safari / Chrome / Edge 都行），别在微信里直接点开——微信内置浏览器保存文件会受限。

<script>
const CONS_MAP={
  "bh": [0x115A5],
  "ch": [0x11594],
  "dh": [0x115A0],
  "gh": [0x11591],
  "jh": [0x11596],
  "jñ": [0x11595,0x115BF,0x11597],
  "kh": [0x1158F],
  "kṣ": [0x1158E,0x115BF,0x115AC],
  "ph": [0x115A3],
  "th": [0x1159E],
  "ḍh": [0x1159B],
  "ṭh": [0x11599],
  "b": [0x115A4],
  "c": [0x11593],
  "d": [0x1159F],
  "g": [0x11590],
  "h": [0x115AE],
  "j": [0x11595],
  "k": [0x1158E],
  "l": [0x115A9],
  "m": [0x115A6],
  "n": [0x115A1],
  "p": [0x115A2],
  "r": [0x115A8],
  "s": [0x115AD],
  "t": [0x1159D],
  "v": [0x115AA],
  "y": [0x115A7],
  "ñ": [0x11597],
  "ś": [0x115AB],
  "ḍ": [0x1159A],
  "ṅ": [0x11592],
  "ṇ": [0x1159C],
  "ṣ": [0x115AC],
  "ṭ": [0x11598],
};
const VOWEL_SIGN={
  "ai": [0x115B9],
  "au": [0x115BB],
  "e": [0x115B8],
  "i": [0x115B0],
  "o": [0x115BA],
  "u": [0x115B2],
  "ā": [0x115AF],
  "ī": [0x115B1],
  "ū": [0x115B3],
  "ṛ": [0x115B4],
  "ṝ": [0x115B5],
};
const INDEP={
  "ai": [0x1158B],
  "au": [0x1158D],
  "a": [0x11580],
  "e": [0x1158A],
  "i": [0x11582],
  "o": [0x1158C],
  "u": [0x11584],
  "ā": [0x11581],
  "ī": [0x11583],
  "ū": [0x11585],
  "ḷ": [0x11588],
  "ḹ": [0x11589],
  "ṛ": [0x11586],
  "ṝ": [0x11587],
};

var VIR = 0x115BF, ANU = 0x115BD, VIS = 0x115BE, CAN = 0x115BC;
function S(){ return String.fromCodePoint.apply(null, arguments); }

/* ================= IAST → 悉昙 ================= */
var CONS_ORDER = Object.keys(CONS_MAP).sort(function(a, b){ return b.length - a.length; });
/* 元音匹配顺序必须取「元音符号 ∪ 独立元音」的并集：
   因为 ḷ / ḹ 没有对应的元音符号，只存在于 INDEP 里，
   若只取 VOWEL_SIGN 的键，这类元音会被整个漏掉。 */
var VOW_ORDER = Object.keys(VOWEL_SIGN).concat(Object.keys(INDEP))
  .filter(function(v, i, arr){ return arr.indexOf(v) === i; })
  .sort(function(a, b){ return b.length - a.length; });
var VOWEL_CHARS = /[a-zA-Zāīūṛṝḷḹñṅṭḍṇśṣ]/;

function isModifierAt(text, i){
  var c = text[i];
  if (c === "ṃ" || c === "ṁ" || c === "ḥ") return true;
  if (c === "m" && text[i + 1] === "\u0310") return true;
  return false;
}

function iastToSiddham(input){
  var text = (input || "").normalize("NFC").replace(/\u1E41/g, "\u1E43"); // ṁ → ṃ
  var out = "", i = 0;
  while (i < text.length) {
    var ch = text[i];
    if (!VOWEL_CHARS.test(ch)) { out += ch; i++; continue; }

    // ① 收集辅音串
    var cluster = [];
    while (true) {
      var hit = null;
      for (var k = 0; k < CONS_ORDER.length; k++) {
        var key = CONS_ORDER[k];
        if (key === "m" && text[i + 1] === "\u0310") continue;   // m̐ 是仰月点，不是辅音
        if (text.startsWith(key, i)) { hit = key; break; }
      }
      if (!hit) break;
      cluster.push(CONS_MAP[hit]);
      i += hit.length;
    }

    var piece = "";
    if (cluster.length) {
      for (var n = 0; n < cluster.length; n++) {
        if (n) piece += S(VIR);
        piece += S.apply(null, cluster[n]);
      }
      // ② 元音
      var v = null;
      for (var q = 0; q < VOW_ORDER.length; q++) {
        if (text.startsWith(VOW_ORDER[q], i)) { v = VOW_ORDER[q]; i += v.length; break; }
      }
      if (v === null) {
        if (!isModifierAt(text, i)) piece += S(VIR);   // 无元音 → 消元音号
      } else if (v === "a") {
        /* 默认元音，不写符号 */
      } else if (VOWEL_SIGN[v] !== undefined) {
        piece += S(VOWEL_SIGN[v]);
      } else if (INDEP[v] !== undefined) {
        piece += S(VIR) + S(INDEP[v]);                 // ḷ / ḹ 无元音符号
      }
    } else {
      // ①′ 独立元音
      var iv = null;
      for (var p = 0; p < VOW_ORDER.length; p++) {
        if (text.startsWith(VOW_ORDER[p], i)) { iv = VOW_ORDER[p]; i += iv.length; break; }
      }
      if (iv === null) { out += ch; i++; continue; }
      if (INDEP[iv] !== undefined) piece += S(INDEP[iv]);
      else { out += iv; continue; }
    }

    // ③ 附加符号
    if (text[i] === "ṃ" || text[i] === "ṁ") { piece += S(ANU); i++; }
    else if (text[i] === "ḥ") { piece += S(VIS); i++; }
    else if (text[i] === "m" && text[i + 1] === "\u0310") { piece += S(CAN); i += 2; }

    out += piece;
  }
  return out;
}

function setSize(v){

$("#minus").onclick = function(){ setSize(size - 4); };
$("#clear").onclick = function(){
  if (!paper.innerText.trim() || confirm("清空当前内容？")) { paper.innerHTML = ""; paper.focus(); }
};

function insertText(txt){
  paper.focus();
  var sel = window.getSelection();
  if (!sel.rangeCount || !paper.contains(sel.anchorNode)) {
    paper.appendChild(document.createTextNode(txt));
    return;
  }
  var r = sel.getRangeAt(0);
  r.deleteContents();
  var node = document.createTextNode(txt);
  r.insertNode(node);
  r.setStartAfter(node); r.collapse(true);
  sel.removeAllRanges(); sel.addRange(r);
}

function convertAndInsert(space){
  var box = $("#iast");
  var raw = box.value;
  if (!raw.trim()) return;
  var out = iastToSiddham(raw);
  insertText(out + (space ? " " : ""));
  box.value = "";
}
$("#ins").onclick = function(){ convertAndInsert(true); };
$("#iast").addEventListener("keydown", function(e){
  if (e.key === " ") { e.preventDefault(); convertAndInsert(true); }
  else if (e.key === "Enter") { e.preventDefault(); convertAndInsert(false); }
});

$("#copy").onclick = function(){
  var t = paper.innerText;
  if (!t) return;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
    .then(function(){ toast("已复制"); })
    .catch(function(){
      var ta = document.createElement("textarea");
      ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("已复制"); } catch(e) { toast("复制失败，请长按选择"); }
      document.body.removeChild(ta);
    });
};

function toast(msg){
  var d = document.createElement("div");
  d.textContent = msg;
  d.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2c261e;color:#fff;" +
    "padding:9px 16px;border-radius:99px;font-size:13px;z-index:99;opacity:0;transition:opacity .18s";
  document.body.appendChild(d);
  requestAnimationFrame(function(){ d.style.opacity = "1"; });
  setTimeout(function(){ d.style.opacity = "0"; setTimeout(function(){ d.remove(); }, 200); }, 1400);
}

function wrapLines(ctx, text, maxW){
  var lines = [];
  text.split("\n").forEach(function(par){
    if (!par) { lines.push(""); return; }
    var words = par.split(/(\s+)/);
    var cur = "";
    words.forEach(function(w){
      if (!w) return;
      var test = cur + w;
      if (ctx.measureText(test).width <= maxW) { cur = test; return; }
      if (cur) { lines.push(cur.replace(/\s+$/, "")); cur = w.replace(/^\s+/, ""); }
      else { cur = w; }
      // 单个词仍超宽 → 按字符断
      if (ctx.measureText(cur).width > maxW) {
        var buf = "";
        for (var i = 0; i < cur.length; i++){
          if (ctx.measureText(buf + cur[i]).width > maxW && buf) { lines.push(buf); buf = cur[i]; }
          else buf += cur[i];
        }
        cur = buf;
      }
    });
    lines.push(cur);
  });
  return lines;
}

function renderPNG(text, fs){
  var scale = Math.min(3, Math.max(2, window.devicePixelRatio || 2));
  var fs = Math.max(24, size);
  var padX = 56, padY = 48, maxW = 1240;

  var probe = document.createElement("canvas").getContext("2d");
  probe.font = fs + 'px "SiddhamEmbed"';
  var lines = wrapLines(probe, text, maxW);
  var lineH = fs * 1.95;

  var W = maxW + padX * 2;
  var H = Math.max(lineH * lines.length + padY * 2, lineH + padY * 2);

  var c = document.createElement("canvas");
  c.width = Math.round(W * scale);
  c.height = Math.round(H * scale);
  var g = c.getContext("2d");
  g.scale(scale, scale);

  g.fillStyle = "#fffdf9";
  g.fillRect(0, 0, W, H);
  g.fillStyle = "#16120d";
  g.font = fs + 'px "SiddhamEmbed"';
  g.textBaseline = "alphabetic";
  lines.forEach(function(line, i){
    g.fillText(line, padX, padY + lineH * (i + 1) - fs * 0.35);
  });

  return {data: c.toDataURL("image/png"), w: c.width, h: c.height, lines: lines.length};
}

$("#png").onclick = function(){
  var text = paper.innerText.replace(/\n+$/, "");
  if (!text.trim()) { toast("先写点内容"); return; }
  var go = function(){$("#png").disabled = false;};
  $("#png").disabled = true;
  (document.fonts ? document.fonts.load('16px "SiddhamEmbed"') : Promise.resolve())
    .then(function(){ go(); doExport(text); })
    .catch(function(){ go(); doExport(text); });
};

function doExport(text){
  var r = renderPNG(text, Math.max(24, size));
  var data = r.data;
  $("#shotimg").src = data;
  $("#dl").href = data;
  $("#dl").download = "siddham-" + new Date().toISOString().slice(0, 10) + ".png";
  $("#shottip").innerHTML = (/(iPhone|iPad|iPod|Android)/i.test(navigator.userAgent))
    ? "手机上如果「下载」不生效，<b>长按上面的图片 → 保存到相册</b>。"
    : "点「下载 PNG」保存；也可以直接右键图片另存。";
  $("#shot").classList.add("on");
}
$("#closeshot").onclick = function(){ $("#shot").classList.remove("on"); };
$("#shot").addEventListener("click", function(e){ if (e.target === this) this.classList.remove("on"); });

$("#pdf").onclick = function(){

                      iastToSiddham("buddhakṣetre");
}

/* ?exportdemo=1：自动导出一次，用于肉眼核对导出的图片 */
if (location.search.indexOf("exportdemo") >= 0) {
  paper.textContent = iastToSiddham("oṃ maṇi padme hūṃ");
  setTimeout(function(){ $("#png").click(); }, 400);
}

/* ---------------- 自检（?selftest=1） ---------------- */
if (location.search.indexOf("selftest") >= 0) {
  var L = [];
  (document.fonts ? document.fonts.load('16px "SiddhamEmbed"') : Promise.resolve()).then(runSelfTest);

  function runSelfTest(){
  function hex(c){ return "U+" + c.toString(16).toUpperCase(); }
  function cps(str){ return Array.from(str).map(function(c){ return hex(c.codePointAt(0)); }).join(" "); }
  function eq(a, b, name){ L.push((a === b ? "PASS " : "FAIL ") + name + (a === b ? "" : "  得到 " + a + " 期望 " + b)); }

  eq(document.fonts.check('16px "SiddhamEmbed"'), true, "内嵌字体已加载");
  eq(iastToSiddham("kṣa") , "\u{1158E}\u{115BF}\u{115AC}", "kṣa 转写");
  eq(iastToSiddham("oṃ"), "\u{1158C}\u{115BD}", "oṃ 转写");
  eq(iastToSiddham("buddhakṣetre").length > 6, true, "长词转写非空");

  var r = renderPNG("\u{1158E}\u{115AF}\u{115A8}\u{115BF}\u{1159D}", 40);
  eq(r.data.indexOf("data:image/png") === 0, true, "导出 PNG 成功");
  eq(r.data.length > 5000, true, "PNG 不是空白（长度 " + r.data.length + "）");

  var total = 0;
  PAL.forEach(function(g){ total += g.items.length; });
  eq(document.documentElement.scrollWidth <= window.innerWidth + 1, true,
     "无横向溢出（" + document.documentElement.scrollWidth + " vs " + window.innerWidth + "）");
  eq(paper.scrollWidth <= paper.clientWidth + 1, true,
     "编辑区内不溢出（" + paper.scrollWidth + " vs " + paper.clientWidth + "）");
  eq(PAL.length, 6, "字符表分组数");
  eq(total, 92, "字符表总数");

  var pre = document.createElement("pre");
  pre.id = "selftest";
  pre.style.cssText = "position:fixed;left:0;bottom:0;z-index:999;background:#fff;font:11px Menlo;" +
    "padding:8px;margin:0;max-width:100%;white-space:pre-wrap;border-top:1px solid #ccc";
  pre.textContent = L.join("\n");
  document.body.appendChild(pre);
  }
}
