:root{
  --bg:#faf7f2; --paper:#fffdf9; --fg:#1c1813; --muted:#8b8175;
  --line:#e6ddcf; --accent:#8a6f4a; --soft:#f1e9dc; --ok:#3f6b46;
  --pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;max-width:100%;overflow-x:hidden;height:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Apple Symbols","Noto Sans SC",sans-serif;
  -webkit-text-size-adjust:100%;
  display:flex;flex-direction:column;
}

/* ---------- 顶栏 ---------- */
.bar{
  position:sticky;top:0;z-index:30;background:rgba(250,247,242,.96);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
  padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:8px;
}
.bar h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.badge{font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--soft);
  color:#7a6242;white-space:nowrap;transition:opacity .3s;opacity:0}
.badge.on{opacity:1}
.badge.ok{background:#e8f1e8;color:var(--ok)}
.badge.bad{background:#fbe9e4;color:#a94d34}
.spacer{flex:1}
button{
  font:inherit;font-size:12.5px;padding:7px 11px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:#4d4438;white-space:nowrap;
}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.ic{font-size:16px;line-height:1;padding:6px 10px}

/* ---------- 编辑区 ---------- */
.main{flex:1;display:flex;flex-direction:column;min-height:0}
.wrap{max-width:900px;width:100%;margin:0 auto;padding:12px 12px 0;flex:1;display:flex;flex-direction:column;min-height:0}
#paper{
  font-family:"SiddhamEmbed",sans-serif;
  font-size:32px;line-height:2;background:var(--paper);
  border:1px solid var(--line);border-radius:12px;
  padding:18px 16px;flex:1;min-height:180px;
  outline:none;white-space:pre-wrap;overflow-wrap:anywhere;
  box-shadow:0 1px 0 rgba(0,0,0,.02);overflow-y:auto;
}
#paper:empty:before{
  content:attr(data-ph);color:#c3b8a6;font-family:-apple-system,"PingFang SC",sans-serif;
  font-size:13.5px;line-height:1.9;
}

/* ---------- 底部输入坞 ---------- */
.dock{
  position:sticky;bottom:0;z-index:25;background:rgba(250,247,242,.97);
  backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
}
.dock-in{max-width:900px;margin:0 auto}
#pv{
  font-family:"SiddhamEmbed",sans-serif;font-size:22px;line-height:1.5;color:#3a3128;
  min-height:0;max-height:66px;overflow:hidden;padding:0 2px;transition:min-height .12s;
}
#pv:empty{min-height:0}
.row{display:flex;gap:8px;align-items:center}
#iast{
  flex:1;min-width:0;font:inherit;font-size:15px;padding:11px 13px;
  border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;
}
#iast:focus{border-color:#c9b591}
#ins{padding:11px 14px;font-size:13.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:9px 0 2px;-webkit-overflow-scrolling:touch;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{
  font-size:11.5px;padding:6px 10px;border-radius:99px;background:#fff;color:#6b5f4d;
  border-color:#e7dccb;flex:none;
}
.chips button.sd{font-family:"SiddhamEmbed";font-size:17px;padding:4px 12px;line-height:1.3}

/* ---------- 更多菜单 ---------- */
#veil{position:fixed;inset:0;background:rgba(25,20,15,.35);z-index:40;display:none}
#veil.on{display:block}
#menu{
  position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;
  border-radius:16px 16px 0 0;padding:8px 12px calc(14px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);
  max-width:640px;margin:0 auto;
}
#menu.on{transform:translateY(0)}
#menu .grab{width:38px;height:4px;border-radius:99px;background:#e4dccd;margin:4px auto 10px}
#menu button{width:100%;justify-content:flex-start;text-align:left;border:0;background:#fff;
  padding:13px 10px;font-size:14.5px;border-radius:10px}
#menu button:active{background:#f6f1e8}
#menu button.danger{color:#a94d34}
#menu .sep{height:1px;background:var(--line);margin:6px 4px}
.segs{display:flex;align-items:center;gap:8px;padding:8px 10px}
.segs span{font-size:13px;color:var(--muted)}
.segs .g{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
#menu .segs .g button{width:auto;border:0;border-radius:0;padding:7px 16px;font-size:13px;
  background:#fff;justify-content:center;text-align:center}
#menu .segs .g button.on{background:var(--accent);color:#fff;font-weight:600}

/* ---------- 字符表弹层 ---------- */
.palette{
  position:fixed;left:0;right:0;bottom:0;z-index:45;background:#fff;
  border-radius:16px 16px 0 0;padding:6px 12px calc(16px + env(safe-area-inset-bottom));
  max-height:66vh;overflow:auto;max-width:640px;margin:0 auto;
  box-shadow:0 -10px 28px rgba(0,0,0,.14);
}
.palette[hidden]{display:none}
.palette .top{position:sticky;top:0;background:#fff;padding:6px 0 4px;display:flex;align-items:center;gap:8px}
.palette .top .grab{width:38px;height:4px;border-radius:99px;background:#e4dccd;margin:0 auto}
.palette .top button{margin-left:auto;font-size:12px;padding:5px 10px}
.palette h4{font-size:11.5px;color:var(--muted);margin:12px 0 6px;font-weight:600}
.palette .chars{display:flex;flex-wrap:wrap;gap:4px}
.palette .chars button{font-family:"SiddhamEmbed";font-size:23px;line-height:1.1;padding:6px 8px;min-width:40px;border-radius:7px;background:#fdfbf7}

/* ---------- 帮助 ---------- */
details.help{max-width:900px;margin:10px auto 0;font-size:12.5px;color:var(--muted)}
details.help summary{cursor:pointer;padding:2px 4px;list-style:none;color:#8a7a63}
details.help summary::-webkit-details-marker{display:none}
details.help .body{padding:6px 4px 2px;line-height:1.95}
details.help a{color:#8a6f4a}

/* ---------- 导出结果 ---------- */
#shot{position:fixed;inset:0;background:rgba(20,16,12,.9);z-index:60;display:none;
  padding:16px;overflow:auto}
#shot.on{display:block}
#shot .inner{max-width:900px;margin:0 auto;background:#fff;border-radius:14px;padding:12px}
#shot img{width:100%;display:block;border-radius:8px}
#shot .tip{font-size:12.5px;color:#5c5142;margin:10px 2px 2px;line-height:1.7}
#shot .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

@media print{
  .bar,.dock,details.help,#shot,#veil,#menu{display:none !important}
  body{background:#fff;display:block}
  .wrap{padding:0;max-width:none;display:block}
  #paper{border:0;box-shadow:none;padding:0;font-size:20pt;line-height:1.9;min-height:0;overflow:visible}
  @page{margin:18mm 16mm}
}
</style>
</head>
<body>

<div class="bar">
  <h1>悉昙编辑器</h1>
  <span class="badge" id="fstate">…</span>
  <span class="badge" id="save">已保存</span>
  <span class="spacer"></span>
  <button id="png" class="primary">图片</button>
  <button id="pdf">PDF</button>
  <button id="more" class="ic" aria-label="更多">⋯</button>
</div>

<div class="main">
  <div class="wrap">
    <div id="paper" contenteditable="true" spellcheck="false"
         data-ph="在这里写字。&#10;· 装了悉昙键盘就直接打；&#10;· 没装键盘，用下面的罗马字输入（oṃ maṇi padme hūṃ），空格或回车变悉昙。"></div>

    <details class="help">
      <summary>怎么用 / 打不出来怎么办</summary>
      <div class="body">
        <b>罗马字输入</b>：在底部框里打 <code>oṃ maṇi padme hūṃ</code>，按空格或回车，整段变成悉昙插到光标处。<br>
        <b>直接输入</b>：装了 Keyman 键盘的话，切到「悉昙 IAST」，一键一字符。<br>
        <b>导出</b>：图片＝PNG（手机上长按保存）；PDF＝打印对话框里选「另存为 PDF」。<br>
        <b>内容会自动保存</b>在本机浏览器里，关掉再开还在；换设备不会同步。<br>
        <b>显示成方框</b>：说明用的是别的软件（微信/备忘录）。这一页自带字体，不会出现方框；
        发出去看别人能不能看，就存成图片。<br>
        还没装键盘？<a href="https://share53880.github.io/siddham-web/" target="_blank" rel="noopener">下载 Keyman 安卓版</a>
        · <a href="https://downloads.keyman.com/android/stable/18.0.254/keyman-18.0.254.apk" target="_blank" rel="noopener">官方直链</a>
      </div>
    </details>
  </div>
</div>

<div class="dock">
  <div class="dock-in">
    <div id="pv"></div>
    <div class="row">
      <input id="iast" placeholder="罗马字：oṃ maṇi padme hūṃ" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <button id="ins" class="primary">插入</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<div id="veil"></div>
<div id="menu">
  <div class="grab"></div>
  <button data-act="undo">↩︎ 撤销上一步</button>
  <div class="segs">
    <span>字号</span>
    <div class="g">
      <button data-size="26">小</button>
      <button data-size="32" class="on">中</button>
      <button data-size="40">大</button>
    </div>
  </div>
  <button data-act="copy">复制全文</button>
  <button data-act="palette">字符表（按类插入）</button>
  <div class="sep"></div>
  <button data-act="clear" class="danger">清空全文</button>
</div>

<div id="pal" class="palette" hidden>
  <div class="top"><div class="grab"></div><button id="palclose">关闭</button></div>
</div>

<div id="shot">
  <div class="inner">
    <img id="shotimg" alt="导出的图片">
    <div class="tip" id="shottip"></div>
    <div class="acts">
      <a id="dl" download="siddham.png"><button class="primary">下载 PNG</button></a>
      <button id="closeshot">关闭</button>
    </div>
  </div>
</div>

<script>
const CONS_MAP={
  "bh": [0x115A5],
  "ch": [0x11594],
  "dh": [0x115A0],
  "gh": [0x11591],
  "jh": [0x11596],
  "jñ": [0x11595,0x115BF,0x11597],
  "kh": [0x1158F],
  "kṣ": [0x1158E,0x115BF,0x115AC],
  "ph": [0x115A3],
  "th": [0x1159E],
  "ḍh": [0x1159B],
  "ṭh": [0x11599],
  "b": [0x115A4],
  "c": [0x11593],
  "d": [0x1159F],
  "g": [0x11590],
  "h": [0x115AE],
  "j": [0x11595],
  "k": [0x1158E],
  "l": [0x115A9],
  "m": [0x115A6],
  "n": [0x115A1],
  "p": [0x115A2],
  "r": [0x115A8],
  "s": [0x115AD],
  "t": [0x1159D],
  "v": [0x115AA],
  "y": [0x115A7],
  "ñ": [0x11597],
  "ś": [0x115AB],
  "ḍ": [0x1159A],
  "ṅ": [0x11592],
  "ṇ": [0x1159C],
  "ṣ": [0x115AC],
  "ṭ": [0x11598],
};
const VOWEL_SIGN={
  "ai": [0x115B9],
  "au": [0x115BB],
  "e": [0x115B8],
  "i": [0x115B0],
  "o": [0x115BA],
  "u": [0x115B2],
  "ā": [0x115AF],
  "ī": [0x115B1],
  "ū": [0x115B3],
  "ṛ": [0x115B4],
  "ṝ": [0x115B5],
};
const INDEP={
  "ai": [0x1158B],
  "au": [0x1158D],
  "a": [0x11580],
  "e": [0x1158A],
  "i": [0x11582],
  "o": [0x1158C],
  "u": [0x11584],
  "ā": [0x11581],
  "ī": [0x11583],
  "ū": [0x11585],
  "ḷ": [0x11588],
  "ḹ": [0x11589],
  "ṛ": [0x11586],
  "ṝ": [0x11587],
};

var VIR = 0x115BF, ANU = 0x115BD, VIS = 0x115BE, CAN = 0x115BC;
function S(){ return String.fromCodePoint.apply(null, arguments); }

/* ================= IAST → 悉昙 ================= */
var CONS_ORDER = Object.keys(CONS_MAP).sort(function(a, b){ return b.length - a.length; });
/* 元音匹配顺序必须取「元音符号 ∪ 独立元音」的并集：
   因为 ḷ / ḹ 没有对应的元音符号，只存在于 INDEP 里，
   若只取 VOWEL_SIGN 的键，这类元音会被整个漏掉。 */
var VOW_ORDER = Object.keys(VOWEL_SIGN).concat(Object.keys(INDEP))
  .filter(function(v, i, arr){ return arr.indexOf(v) === i; })
  .sort(function(a, b){ return b.length - a.length; });
var VOWEL_CHARS = /[a-zA-Zāīūṛṝḷḹñṅṭḍṇśṣ]/;

function isModifierAt(text, i){
  var c = text[i];
  if (c === "ṃ" || c === "ṁ" || c === "ḥ") return true;
  if (c === "m" && text[i + 1] === "\u0310") return true;
  return false;
}

function iastToSiddham(input){
  var text = (input || "").normalize("NFC").replace(/\u1E41/g, "\u1E43"); // ṁ → ṃ
  var out = "", i = 0;
  while (i < text.length) {
    var ch = text[i];
    if (!VOWEL_CHARS.test(ch)) { out += ch; i++; continue; }

    // ① 收集辅音串
    var cluster = [];
    while (true) {
      var hit = null;
      for (var k = 0; k < CONS_ORDER.length; k++) {
        var key = CONS_ORDER[k];
        if (key === "m" && text[i + 1] === "\u0310") continue;   // m̐ 是仰月点，不是辅音
        if (text.startsWith(key, i)) { hit = key; break; }
      }
      if (!hit) break;
      cluster.push(CONS_MAP[hit]);
      i += hit.length;
    }

    var piece = "";
    if (cluster.length) {
      for (var n = 0; n < cluster.length; n++) {
        if (n) piece += S(VIR);
        piece += S.apply(null, cluster[n]);
      }
      // ② 元音
      var v = null;
      for (var q = 0; q < VOW_ORDER.length; q++) {
        if (text.startsWith(VOW_ORDER[q], i)) { v = VOW_ORDER[q]; i += v.length; break; }
      }
      if (v === null) {
        if (!isModifierAt(text, i)) piece += S(VIR);   // 无元音 → 消元音号
      } else if (v === "a") {
        /* 默认元音，不写符号 */
      } else if (VOWEL_SIGN[v] !== undefined) {
        piece += S(VOWEL_SIGN[v]);
      } else if (INDEP[v] !== undefined) {
        piece += S(VIR) + S(INDEP[v]);                 // ḷ / ḹ 无元音符号
      }
    } else {
      // ①′ 独立元音
      var iv = null;
      for (var p = 0; p < VOW_ORDER.length; p++) {
        if (text.startsWith(VOW_ORDER[p], i)) { iv = VOW_ORDER[p]; i += iv.length; break; }
      }
      if (iv === null) { out += ch; i++; continue; }
      if (INDEP[iv] !== undefined) piece += S(INDEP[iv]);
      else { out += iv; continue; }
    }

    // ③ 附加符号
    if (text[i] === "ṃ" || text[i] === "ṁ") { piece += S(ANU); i++; }
    else if (text[i] === "ḥ") { piece += S(VIS); i++; }
    else if (text[i] === "m" && text[i + 1] === "\u0310") { piece += S(CAN); i += 2; }

    out += piece;
  }
  return out;
}



/* ================= 基础 ================= */
var $ = function(s){ return document.querySelector(s); };
var paper = $("#paper"), size = 32;

function toast(msg){
  var d = document.createElement("div");
  d.textContent = msg;
  d.style.cssText = "position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#2c261e;color:#fff;" +
    "padding:9px 16px;border-radius:99px;font-size:13px;z-index:99;opacity:0;transition:opacity .18s;max-width:86vw;text-align:center";
  document.body.appendChild(d);
  requestAnimationFrame(function(){ d.style.opacity = "1"; });
  setTimeout(function(){ d.style.opacity = "0"; setTimeout(function(){ d.remove(); }, 200); }, 1500);
}

/* 字体状态 */
if (document.fonts && document.fonts.load) {
  document.fonts.load('16px "SiddhamEmbed"').then(function(){
    var ok = document.fonts.check('16px "SiddhamEmbed"');
    var el = $("#fstate");
    el.textContent = ok ? "字体内嵌" : "字体失败";
    el.className = "badge on " + (ok ? "ok" : "bad");
    setTimeout(function(){ el.classList.remove("on"); }, 2200);
  });
}

/* ================= 自动保存 ================= */
var KEY = "siddham.editor.v1", saveTimer = null;
function saveNow(){
  try{
    localStorage.setItem(KEY, paper.innerText);
    var b = $("#save"); b.textContent = "已保存"; b.className = "badge on ok";
    clearTimeout(b._t); b._t = setTimeout(function(){ b.classList.remove("on"); }, 1400);
  }catch(e){}
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 700); }
paper.addEventListener("input", function(){ scheduleSave(); });

(function restore(){
  try{
    var v = localStorage.getItem(KEY);
    if (v && v.trim()) { paper.textContent = v; toast("已恢复上次内容"); }
  }catch(e){}
})();

/* ================= 插入 / 转写 ================= */
function insertText(txt){
  paper.focus();
  var sel = window.getSelection();
  if (!sel.rangeCount || !paper.contains(sel.anchorNode)) {
    paper.appendChild(document.createTextNode(txt));
  } else {
    var r = sel.getRangeAt(0);
    r.deleteContents();
    var node = document.createTextNode(txt);
    r.insertNode(node);
    r.setStartAfter(node); r.collapse(true);
    sel.removeAllRanges(); sel.addRange(r);
  }
  scheduleSave();
}

var iastEl = $("#iast"), pv = $("#pv");
function updatePreview(){
  var v = iastEl.value;
  pv.textContent = v.trim() ? iastToSiddham(v) : "";
}
iastEl.addEventListener("input", updatePreview);

function commit(space){
  var raw = iastEl.value;
  if (!raw.trim()) return;
  var out = iastToSiddham(raw);
  insertText(out + (space ? " " : ""));
  iastEl.value = ""; updatePreview();
  iastEl.focus();
}
$("#ins").onclick = function(){ commit(true); };
iastEl.addEventListener("keydown", function(e){
  if (e.key === " ") { e.preventDefault(); commit(true); }
  else if (e.key === "Enter") { e.preventDefault(); commit(false); }
});

/* ================= 常用咒语 / 种子字 ================= */
var CHIPS = [
  ["oṃ maṇi padme hūṃ", "六字大明咒"],
  ["gate gate pāragate pārasaṃgate bodhi svāhā", "心经末咒"],
  ["oṃ āḥ hūṃ", "三字根本咒"],
  ["namaḥ samantavajrāṇāṃ", "大悲咒首句"],
  ["hūṃ", "吽"],
  ["hrīḥ", "纥哩"],
  ["trāṃ", "怛罗"],
  ["bhrūṃ", "佛顶尊胜"]
];
(function(){
  var host = $("#chips");
  CHIPS.forEach(function(it){
    var b = document.createElement("button");
    var isSeed = it[0].indexOf(" ") < 0;
    b.textContent = isSeed ? iastToSiddham(it[0]) : it[1];
    b.title = it[0];
    if (isSeed) b.className = "sd";
    b.onclick = function(){ insertText(iastToSiddham(it[0])); };
    host.appendChild(b);
  });
})();

/* ================= 更多菜单 ================= */
var menu = $("#menu"), veil = $("#veil");
function openMenu(open){
  menu.classList.toggle("on", open); veil.classList.toggle("on", open);
}
$("#more").onclick = function(){ openMenu(true); };
veil.onclick = function(){ openMenu(false); $("#pal").hidden = true; veil.classList.remove("on"); };
$("#palclose").onclick = function(){ $("#pal").hidden = true; veil.classList.remove("on"); };
menu.addEventListener("click", function(e){
  var t = e.target.closest("button"); if (!t) return;
  var act = t.dataset.act;
  if (act === "undo") { paper.focus(); document.execCommand("undo"); scheduleSave(); }
  if (act === "copy") copyAll();
  if (act === "palette") { openPalette(); }
  if (act === "clear") {
    if (!paper.innerText.trim() || confirm("清空全文？清空后可以用「撤销」找回。")) {
      paper.innerHTML = ""; saveNow();
    }
  }
  openMenu(false);
});

document.querySelectorAll("#menu .g button").forEach(function(b){
  b.onclick = function(){
    size = +b.dataset.size; paper.style.fontSize = size + "px";
    document.querySelectorAll("#menu .g button").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
  };
});

function copyAll(){
  var t = paper.innerText;
  if (!t) { toast("还没有内容"); return; }
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
    .then(function(){ toast("已复制全文"); })
    .catch(function(){
      var ta = document.createElement("textarea");
      ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("已复制全文"); } catch(e) { toast("复制失败，请长按选择"); }
      document.body.removeChild(ta);
    });
}

/* ================= 字符表 ================= */

/* ================= 导出 PNG ================= */
function wrapLines(ctx, text, maxW){
  var lines = [];
  text.split("\n").forEach(function(par){
    if (!par) { lines.push(""); return; }
    var words = par.split(/(\s+)/), cur = "";
    words.forEach(function(w){
      if (!w) return;
      var test = cur + w;
      if (ctx.measureText(test).width <= maxW) { cur = test; return; }
      if (cur) { lines.push(cur.replace(/\s+$/, "")); cur = w.replace(/^\s+/, ""); }
      else { cur = w; }
      if (ctx.measureText(cur).width > maxW) {
        var buf = "";
        for (var i = 0; i < cur.length; i++){
          if (ctx.measureText(buf + cur[i]).width > maxW && buf) { lines.push(buf); buf = cur[i]; }
          else buf += cur[i];
        }
        cur = buf;
      }
    });
    lines.push(cur);
  });
  return lines;
}

function renderPNG(text, fs){
  var scale = Math.min(3, Math.max(2, window.devicePixelRatio || 2));
  var padX = 56, padY = 48, maxW = 1240;
  var probe = document.createElement("canvas").getContext("2d");
  probe.font = fs + 'px "SiddhamEmbed"';
  var lines = wrapLines(probe, text, maxW);
  var lineH = fs * 1.95;
  var W = maxW + padX * 2;
  var H = Math.max(lineH * lines.length + padY * 2, lineH + padY * 2);
  var c = document.createElement("canvas");
  c.width = Math.round(W * scale); c.height = Math.round(H * scale);
  var g = c.getContext("2d");
  g.scale(scale, scale);
  g.fillStyle = "#fffdf9"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#16120d"; g.font = fs + 'px "SiddhamEmbed"'; g.textBaseline = "alphabetic";
  lines.forEach(function(line, i){
    g.fillText(line, padX, padY + lineH * (i + 1) - fs * 0.35);
  });
  return {data: c.toDataURL("image/png"), w: c.width, h: c.height, lines: lines.length};
}

};
function doExport(){
  var text = paper.innerText.replace(/\n+$/, "");
  var r = renderPNG(text, Math.max(24, size));
  $("#shotimg").src = r.data;
  $("#dl").href = r.data;
  $("#dl").download = "siddham-" + new Date().toISOString().slice(0, 10) + ".png";
  $("#shottip").innerHTML = (/(iPhone|iPad|iPod|Android)/i.test(navigator.userAgent))

    : "点「下载 PNG」保存，或右键图片另存。";
  $("#shot").classList.add("on");
}
