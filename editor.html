:root{
  --bg:#faf7f2; --paper:#fffdf9; --fg:#1c1813; --muted:#8b8175;
  --line:#e6ddcf; --accent:#8a6f4a; --soft:#f1e9dc; --ok:#3f6b46;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;max-width:100%;overflow-x:hidden;height:100%}
body{background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Apple Symbols","Noto Sans SC",sans-serif;
  -webkit-text-size-adjust:100%;display:flex;flex-direction:column}

.bar{position:sticky;top:0;z-index:30;background:rgba(250,247,242,.96);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
  padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:8px}
.bar h1{font-size:14px;margin:0;font-weight:600;white-space:nowrap}
.badge{font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--soft);
  color:#7a6242;white-space:nowrap;transition:opacity .3s;opacity:0}
.badge.on{opacity:1}
.badge.ok{background:#e8f1e8;color:var(--ok)}
.badge.bad{background:#fbe9e4;color:#a94d34}
.spacer{flex:1}
button{font:inherit;font-size:12.5px;padding:7px 11px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:#4d4438;white-space:nowrap}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.ic{font-size:16px;line-height:1;padding:6px 10px}

.main{flex:1;display:flex;flex-direction:column;min-height:0}
.wrap{max-width:900px;width:100%;margin:0 auto;padding:12px 12px 0;flex:1;display:flex;flex-direction:column;min-height:0}
#paper{font-family:"SiddhamEmbed",sans-serif;font-size:32px;line-height:2;text-align:left;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:18px 16px;flex:1;min-height:180px;outline:none;white-space:pre-wrap;
  overflow-wrap:anywhere;overflow-y:auto;box-shadow:0 1px 0 rgba(0,0,0,.02)}
#paper:empty:before{content:attr(data-ph);color:#c3b8a6;
  font-family:-apple-system,"PingFang SC",sans-serif;font-size:13.5px;line-height:1.9;text-align:left}

.dock{position:sticky;bottom:0;z-index:25;background:rgba(250,247,242,.97);
  backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.dock-in{max-width:900px;margin:0 auto}
#pv{font-family:"SiddhamEmbed",sans-serif;font-size:22px;line-height:1.5;color:#3a3128;
  max-height:66px;overflow:hidden;padding:0 2px}
.row{display:flex;gap:8px;align-items:center}
#iast{flex:1;min-width:0;font:inherit;font-size:15px;padding:11px 13px;
  border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
#iast:focus{border-color:#c9b591}
#ins{padding:11px 14px;font-size:13.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{font-size:11.5px;padding:6px 10px;border-radius:99px;background:#fff;
  color:#6b5f4d;border-color:#e7dccb;flex:none}
.chips button.sd{font-family:"SiddhamEmbed";font-size:17px;padding:4px 12px;line-height:1.3}

#veil{position:fixed;inset:0;background:rgba(25,20,15,.35);z-index:40;display:none}
#veil.on{display:block}
#menu{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;
  border-radius:16px 16px 0 0;padding:8px 12px calc(14px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);
  max-width:640px;margin:0 auto;max-height:86vh;overflow-y:auto}
#menu.on{transform:translateY(0)}
#menu .grab{width:38px;height:4px;border-radius:99px;background:#e4dccd;margin:4px auto 8px}
#menu h3{font-size:11px;color:var(--muted);font-weight:600;margin:14px 6px 6px;letter-spacing:.4px}
#menu button{width:100%;justify-content:flex-start;text-align:left;border:0;background:#fff;
  padding:12px 10px;font-size:14px;border-radius:10px}
#menu button:active{background:#f6f1e8}
#menu button.danger{color:#a94d34}
#menu .sep{height:1px;background:var(--line);margin:6px 4px}
.segs{display:flex;align-items:center;gap:8px;padding:6px 10px}
.segs span{font-size:13px;color:var(--muted);min-width:32px}
.segs .g{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
#menu .segs .g button{width:auto;border:0;border-radius:0;padding:7px 15px;font-size:13px;
  background:#fff;justify-content:center;text-align:center}
#menu .segs .g button.on{background:var(--accent);color:#fff;font-weight:600}
.doc{display:flex;align-items:center;gap:8px;padding:4px 6px}
.doc .t{flex:1;font-size:13.5px;padding:8px 6px;border-radius:8px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.doc .t.on{background:var(--soft);font-weight:600}
.doc .x{font-size:12px;color:#a94d34;padding:6px 8px}
.cloud{display:flex;gap:8px;padding:4px 6px}
.cloud button{flex:1;text-align:center;justify-content:center;border:1px solid var(--line);
  font-size:13px;padding:10px 8px}

details.help{max-width:900px;margin:10px auto 0;font-size:12.5px;color:var(--muted)}
details.help summary{cursor:pointer;padding:2px 4px;list-style:none;color:#8a7a63}
details.help summary::-webkit-details-marker{display:none}
details.help .body{padding:6px 4px 2px;line-height:1.95}
details.help a{color:#8a6f4a}

.palette{position:fixed;left:0;right:0;bottom:0;z-index:45;background:#fff;
  border-radius:16px 16px 0 0;padding:6px 12px calc(16px + env(safe-area-inset-bottom));
  max-height:66vh;overflow:auto;max-width:640px;margin:0 auto;box-shadow:0 -10px 28px rgba(0,0,0,.14)}
.palette[hidden]{display:none}
.palette .top{position:sticky;top:0;background:#fff;padding:6px 0 4px;display:flex;align-items:center}
.palette .top .grab{width:38px;height:4px;border-radius:99px;background:#e4dccd;margin:0 auto}
.palette .top button{margin-left:auto;font-size:12px;padding:5px 10px}
.palette h4{font-size:11.5px;color:var(--muted);margin:12px 0 6px;font-weight:600}
.palette .chars{display:flex;flex-wrap:wrap;gap:4px}
.palette .chars button{font-family:"SiddhamEmbed";font-size:23px;line-height:1.1;padding:6px 8px;
  min-width:40px;border-radius:7px;background:#fdfbf7}

#shot{position:fixed;inset:0;background:rgba(20,16,12,.9);z-index:60;display:none;
  padding:16px;overflow:auto}
#shot.on{display:block}
#shot .inner{max-width:900px;margin:0 auto;background:#fff;border-radius:14px;padding:12px}
#shot img{width:100%;display:block;border-radius:8px}
#shot .tip{font-size:12.5px;color:#5c5142;margin:10px 2px 2px;line-height:1.7}
#shot .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

@media print{
  .bar,.dock,details.help,#shot,#veil,#menu,.palette{display:none !important}
  body{background:#fff;display:block}
  .wrap{padding:0;max-width:none;display:block}
  #paper{border:0;box-shadow:none;padding:0;font-size:20pt;min-height:0;overflow:visible}
  @page{margin:18mm 16mm}
}
</style>
</head>
<body>

<div class="bar">
  <h1>悉昙编辑器</h1>
  <span class="badge" id="fstate">…</span>
  <span class="badge" id="save">已保存</span>
  <span class="spacer"></span>
  <button id="png" class="primary">图片</button>
  <button id="pdf">PDF</button>
  <button id="more" class="ic" aria-label="更多">⋯</button>
</div>

<div class="main">
  <div class="wrap">
    <div id="paper" contenteditable="true" spellcheck="false"
         data-ph="在这里写字。&#10;· 装了悉昙键盘就直接打；&#10;· 没装键盘，用下面的罗马字输入（oṃ maṇi padme hūṃ），空格或回车变悉昙。"></div>

    <details class="help">
      <summary>怎么用 / 打不出来怎么办</summary>
      <div class="body">
        <b>罗马字输入</b>：底部框里打 <code>oṃ maṇi padme hūṃ</code>，空格或回车，整段变悉昙插入。<br>
        <b>直接输入</b>：装了 Keyman 就切到「悉昙 IAST」，一键一字符。<br>
        <b>导出</b>：图片＝PNG（手机上长按保存）；PDF＝打印里选「另存为 PDF」。<br>

        <b>显示成方框</b>：那是别的软件（微信/备忘录）缺字体；这一页自带字体不会。发人看就存图片。<br>
        还没装键盘？<a href="keyman-android.apk" download>下载 Keyman 安卓版（APK）</a>
        · <a href="https://downloads.keyman.com/android/stable/18.0.254/keyman-18.0.254.apk" target="_blank" rel="noopener">官方直链</a>

</div>

<div class="dock">
  <div class="dock-in">
    <div id="pv"></div>
    <div class="row">
      <input id="iast" placeholder="罗马字：oṃ maṇi padme hūṃ" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <button id="ins" class="primary">插入</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<div id="veil"></div>
<div id="menu">
  <div class="grab"></div>

  <h3>排版</h3>
  <div class="segs"><span>对齐</span>
    <div class="g" id="align">
      <button data-align="left" class="on">左</button>
      <button data-align="center">中</button>
      <button data-align="right">右</button>
    </div>
  </div>
  <div class="segs"><span>行距</span>
    <div class="g" id="lh">
      <button data-lh="1.7">紧</button>
      <button data-lh="2" class="on">中</button>
      <button data-lh="2.5">宽</button>

<div id="pal" class="palette" hidden>

</div>

<div id="shot">

    <img id="shotimg" alt="导出的图片">
    <div class="tip" id="shottip"></div>

      <button id="closeshot">关闭</button>

<script>
const CONS_MAP={
  "bh": [0x115A5],
  "ch": [0x11594],
  "dh": [0x115A0],
  "gh": [0x11591],
  "jh": [0x11596],
  "jñ": [0x11595,0x115BF,0x11597],
  "kh": [0x1158F],
  "kṣ": [0x1158E,0x115BF,0x115AC],
  "ph": [0x115A3],
  "th": [0x1159E],
  "ḍh": [0x1159B],
  "ṭh": [0x11599],
  "b": [0x115A4],
  "c": [0x11593],
  "d": [0x1159F],
  "g": [0x11590],
  "h": [0x115AE],
  "j": [0x11595],
  "k": [0x1158E],
  "l": [0x115A9],
  "m": [0x115A6],
  "n": [0x115A1],
  "p": [0x115A2],
  "r": [0x115A8],
  "s": [0x115AD],
  "t": [0x1159D],
  "v": [0x115AA],
  "y": [0x115A7],
  "ñ": [0x11597],
  "ś": [0x115AB],
  "ḍ": [0x1159A],
  "ṅ": [0x11592],
  "ṇ": [0x1159C],
  "ṣ": [0x115AC],
  "ṭ": [0x11598],
};
const VOWEL_SIGN={
  "ai": [0x115B9],
  "au": [0x115BB],
  "e": [0x115B8],
  "i": [0x115B0],
  "o": [0x115BA],
  "u": [0x115B2],
  "ā": [0x115AF],
  "ī": [0x115B1],
  "ū": [0x115B3],
  "ṛ": [0x115B4],
  "ṝ": [0x115B5],
};
const INDEP={
  "ai": [0x1158B],
  "au": [0x1158D],
  "a": [0x11580],
  "e": [0x1158A],
  "i": [0x11582],
  "o": [0x1158C],
  "u": [0x11584],
  "ā": [0x11581],
  "ī": [0x11583],
  "ū": [0x11585],
  "ḷ": [0x11588],
  "ḹ": [0x11589],
  "ṛ": [0x11586],
  "ṝ": [0x11587],
};

var VIR = 0x115BF, ANU = 0x115BD, VIS = 0x115BE, CAN = 0x115BC;
function S(){ return String.fromCodePoint.apply(null, arguments); }

/* ================= IAST → 悉昙 ================= */
var CONS_ORDER = Object.keys(CONS_MAP).sort(function(a, b){ return b.length - a.length; });
/* 元音匹配顺序必须取「元音符号 ∪ 独立元音」的并集：
   因为 ḷ / ḹ 没有对应的元音符号，只存在于 INDEP 里，
   若只取 VOWEL_SIGN 的键，这类元音会被整个漏掉。 */
var VOW_ORDER = Object.keys(VOWEL_SIGN).concat(Object.keys(INDEP))
  .filter(function(v, i, arr){ return arr.indexOf(v) === i; })
  .sort(function(a, b){ return b.length - a.length; });
var VOWEL_CHARS = /[a-zA-Zāīūṛṝḷḹñṅṭḍṇśṣ]/;

function isModifierAt(text, i){
  var c = text[i];
  if (c === "ṃ" || c === "ṁ" || c === "ḥ") return true;
  if (c === "m" && text[i + 1] === "\u0310") return true;
  return false;
}

function iastToSiddham(input){
  var text = (input || "").normalize("NFC").replace(/\u1E41/g, "\u1E43"); // ṁ → ṃ
  var out = "", i = 0;
  while (i < text.length) {
    var ch = text[i];
    if (!VOWEL_CHARS.test(ch)) { out += ch; i++; continue; }

    // ① 收集辅音串
    var cluster = [];
    while (true) {
      var hit = null;
      for (var k = 0; k < CONS_ORDER.length; k++) {
        var key = CONS_ORDER[k];
        if (key === "m" && text[i + 1] === "\u0310") continue;   // m̐ 是仰月点，不是辅音
        if (text.startsWith(key, i)) { hit = key; break; }
      }
      if (!hit) break;
      cluster.push(CONS_MAP[hit]);
      i += hit.length;
    }

    var piece = "";
    if (cluster.length) {
      for (var n = 0; n < cluster.length; n++) {
        if (n) piece += S(VIR);
        piece += S.apply(null, cluster[n]);
      }
      // ② 元音
      var v = null;
      for (var q = 0; q < VOW_ORDER.length; q++) {
        if (text.startsWith(VOW_ORDER[q], i)) { v = VOW_ORDER[q]; i += v.length; break; }
      }
      if (v === null) {
        if (!isModifierAt(text, i)) piece += S(VIR);   // 无元音 → 消元音号
      } else if (v === "a") {
        /* 默认元音，不写符号 */
      } else if (VOWEL_SIGN[v] !== undefined) {
        piece += S(VOWEL_SIGN[v]);
      } else if (INDEP[v] !== undefined) {
        piece += S(VIR) + S(INDEP[v]);                 // ḷ / ḹ 无元音符号
      }
    } else {
      // ①′ 独立元音
      var iv = null;
      for (var p = 0; p < VOW_ORDER.length; p++) {
        if (text.startsWith(VOW_ORDER[p], i)) { iv = VOW_ORDER[p]; i += iv.length; break; }
      }
      if (iv === null) { out += ch; i++; continue; }
      if (INDEP[iv] !== undefined) piece += S(INDEP[iv]);
      else { out += iv; continue; }
    }

    // ③ 附加符号
    if (text[i] === "ṃ" || text[i] === "ṁ") { piece += S(ANU); i++; }
    else if (text[i] === "ḥ") { piece += S(VIS); i++; }
    else if (text[i] === "m" && text[i + 1] === "\u0310") { piece += S(CAN); i += 2; }

    out += piece;
  }
  return out;
}



/* ================= 基础 ================= */
var $ = function(s){ return document.querySelector(s); };
var paper = $("#paper");

function toast(msg, ms){
  var d = document.createElement("div");
  d.textContent = msg;
  d.style.cssText = "position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#2c261e;color:#fff;" +
    "padding:9px 16px;border-radius:99px;font-size:13px;z-index:99;opacity:0;transition:opacity .18s;max-width:86vw;text-align:center";
  document.body.appendChild(d);
  requestAnimationFrame(function(){ d.style.opacity = "1"; });
  setTimeout(function(){ d.style.opacity = "0"; setTimeout(function(){ d.remove(); }, 200); }, ms || 1500);
}

if (document.fonts && document.fonts.load) {
  document.fonts.load('16px "SiddhamEmbed"').then(function(){
    var ok = document.fonts.check('16px "SiddhamEmbed"');
    var el = $("#fstate");
    el.textContent = ok ? "字体内嵌" : "字体失败";
    el.className = "badge on " + (ok ? "ok" : "bad");
    setTimeout(function(){ el.classList.remove("on"); }, 2200);
  });
}

/* ================= 本地存储：多文档 + 排版 ================= */
var STORE = "siddham.v3";
var state = {
  docs: [], current: null,
  layout: { align: "left", lh: 2, size: 32 },
  cloudCode: null
};

function loadState(){
  try{
    var raw = localStorage.getItem(STORE);
    if (raw) { var o = JSON.parse(raw); if (o && o.docs) state = o; }
  }catch(e){}
  // 兼容旧版单文档
  try{
    var old = localStorage.getItem("siddham.editor.v1");
    if ((!state.docs || !state.docs.length) && old && old.trim()) {
      state.docs = [{ id: uid(), title: "我的草稿", text: old, updated: Date.now() }];
      state.current = state.docs[0].id;
    }
  }catch(e){}
  if (!state.docs || !state.docs.length) {
    state.docs = [{ id: uid(), title: "未命名", text: "", updated: Date.now() }];
    state.current = state.docs[0].id;
  }
  if (!state.current || !state.docs.some(function(d){ return d.id === state.current; })) {
    state.current = state.docs[0].id;
  }
  if (!state.layout) state.layout = { align: "left", lh: 2, size: 32 };
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function curDoc(){ return state.docs.filter(function(d){ return d.id === state.current; })[0]; }
function persist(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }

var saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    var d = curDoc(); if (!d) return;
    d.text = paper.innerText; d.updated = Date.now();
    if (!d.title || d.title === "未命名") {
      var first = (d.text || "").trim().split("\n")[0];
      if (first) d.title = first.slice(0, 12);
    }
    persist(); renderDocs();
    var b = $("#save"); b.textContent = "已保存"; b.className = "badge on ok";
    clearTimeout(b._t); b._t = setTimeout(function(){ b.classList.remove("on"); }, 1200);
  }, 600);
}

function applyLayout(){
  var L = state.layout;
  paper.style.textAlign = L.align;
  paper.style.lineHeight = L.lh;
  paper.style.fontSize = L.size + "px";
  document.querySelectorAll("#align button").forEach(function(b){ b.classList.toggle("on", b.dataset.align === L.align); });
  document.querySelectorAll("#lh button").forEach(function(b){ b.classList.toggle("on", +b.dataset.lh === L.lh); });
  document.querySelectorAll("#fs button").forEach(function(b){ b.classList.toggle("on", +b.dataset.size === L.size); });
}

function openDoc(id){
  var d = state.docs.filter(function(x){ return x.id === id; })[0];
  if (!d) return;
  // 先存旧的
  var old = curDoc(); if (old) { old.text = paper.innerText; }
  state.current = id;
  paper.textContent = d.text || "";
  persist(); renderDocs(); applyLayout();
}

function newDoc(){
  var old = curDoc(); if (old) old.text = paper.innerText;
  var d = { id: uid(), title: "未命名", text: "", updated: Date.now() };
  state.docs.unshift(d); state.current = d.id; paper.textContent = "";
  persist(); renderDocs(); paper.focus(); toast("已新建");
}

function delDoc(id){
  if (state.docs.length <= 1) { toast("至少保留一篇"); return; }
  var d = state.docs.filter(function(x){ return x.id === id; })[0];
  if (!confirm("删除「" + (d.title || "未命名") + "」？")) return;
  state.docs = state.docs.filter(function(x){ return x.id !== id; });
  if (state.current === id) state.current = state.docs[0].id;
  paper.textContent = curDoc().text || "";
  persist(); renderDocs(); toast("已删除");
}

function renderDocs(){
  var host = $("#doclist"); if (!host) return;
  host.innerHTML = "";
  state.docs.forEach(function(d){
    var row = document.createElement("div"); row.className = "doc";
    var t = document.createElement("div");
    t.className = "t" + (d.id === state.current ? " on" : "");
    t.textContent = d.title || "未命名";
    t.onclick = function(){ openDoc(d.id); };
    var x = document.createElement("button"); x.className = "x"; x.textContent = "删";
    x.onclick = function(e){ e.stopPropagation(); delDoc(d.id); };
    row.appendChild(t); row.appendChild(x); host.appendChild(row);
  });
}

/* ================= 输入 ================= */
function insertText(txt){
  paper.focus();
  var sel = window.getSelection();
  if (!sel.rangeCount || !paper.contains(sel.anchorNode)) {
    paper.appendChild(document.createTextNode(txt));
  } else {
    var r = sel.getRangeAt(0); r.deleteContents();
    var node = document.createTextNode(txt); r.insertNode(node);
    r.setStartAfter(node); r.collapse(true);
    sel.removeAllRanges(); sel.addRange(r);
  }
  scheduleSave();
}

var iastEl = $("#iast"), pv = $("#pv");

var API = "/api";
function apiBase(){
  var saved = null;
  try { saved = localStorage.getItem("siddham.api"); } catch(e){}
  return (saved || API).replace(/\/$/, "");
}
function cloudSave(){
  var text = paper.innerText;
  if (!text.trim()) { toast("先写点内容"); openMenu(true); return; }
  var d = curDoc();
  fetch(apiBase() + "/save", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ title: d.title, text: text, code: state.cloudCode || undefined })
  }).then(function(r){ return r.json(); }).then(function(j){
    if (j.code) {
      state.cloudCode = j.code; persist();
      var msg = "同步码：" + j.code + "（长按可复制）";
      showCode(j.code);
    } else toast("上传失败");
  }).catch(function(){ toast("连不上同步服务，请确认服务器已启动"); });
}
function cloudLoad(){
  var code = prompt("输入 8 位同步码：", state.cloudCode || "");
  if (!code) return;
  code = code.trim().toLowerCase();
  fetch(apiBase() + "/load?code=" + encodeURIComponent(code))
    .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
    .then(function(o){
      if (!o.ok) { toast(o.j.error === "not found" ? "没有这个同步码" : "取回失败"); return; }

      var d = { id: uid(), title: o.j.title || "云端文档", text: o.j.text || "", updated: Date.now() };
      state.docs.unshift(d); state.current = d.id; state.cloudCode = code;
      paper.textContent = d.text; persist(); renderDocs(); toast("已取回到新文档");
    }).catch(function(){ toast("连不上同步服务"); });
}

    "align-items:center;justify-content:center;padding:20px";

    '<div style="font:600 34px Menlo,monospace;letter-spacing:3px;color:#2c261e">' + code + '</div>' +
    '<div style="display:flex;gap:8px;margin-top:16px">' +
    '<button id="ccopy" style="flex:1;padding:10px">复制</button>' +
    '<button id="cok" style="flex:1;padding:10px;background:#8a6f4a;color:#fff;border-color:#8a6f4a">好</button></div></div>';

/* ================= 导出 ================= */
function wrapLines(ctx, text, maxW){
  var lines = [];
  text.split("\n").forEach(function(par){
    if (!par) { lines.push(""); return; }
    var words = par.split(/(\s+)/), cur = "";
    words.forEach(function(w){
      if (!w) return;
      var test = cur + w;
      if (ctx.measureText(test).width <= maxW) { cur = test; return; }
      if (cur) { lines.push(cur.replace(/\s+$/, "")); cur = w.replace(/^\s+/, ""); }
      else { cur = w; }
      if (ctx.measureText(cur).width > maxW) {
        var buf = "";
        for (var i = 0; i < cur.length; i++){
          if (ctx.measureText(buf + cur[i]).width > maxW && buf) { lines.push(buf); buf = cur[i]; }
          else buf += cur[i];
        }
        cur = buf;
      }
    });
    lines.push(cur);
  });
  return lines;
}

function renderPNG(text, fs, layout){
  var L = layout || state.layout;
  var scale = Math.min(3, Math.max(2, window.devicePixelRatio || 2));
  var padX = 56, padY = 48, maxW = 1240;
  var probe = document.createElement("canvas").getContext("2d");
  probe.font = fs + 'px "SiddhamEmbed"';
  var lines = wrapLines(probe, text, maxW);
  var lineH = fs * (L.lh || 2);
  var W = maxW + padX * 2;
  var H = Math.max(lineH * lines.length + padY * 2, lineH + padY * 2);
  var c = document.createElement("canvas");
  c.width = Math.round(W * scale); c.height = Math.round(H * scale);
  var g = c.getContext("2d");
  g.scale(scale, scale);
  g.fillStyle = "#fffdf9"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#16120d"; g.font = fs + 'px "SiddhamEmbed"'; g.textBaseline = "alphabetic";
  lines.forEach(function(line, i){
    var x = padX;
    var w = g.measureText(line).width;
    if (L.align === "center") x = padX + (maxW - w) / 2;
    else if (L.align === "right") x = padX + (maxW - w);
    g.fillText(line, x, padY + lineH * (i + 1) - fs * 0.35);
  });
  return {data: c.toDataURL("image/png"), w: c.width, h: c.height, lines: lines.length};
}
